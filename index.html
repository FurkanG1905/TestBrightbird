<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bright Bird Cardshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #dfeefb;
      --panel: #edf7ff;
      --cyan: #1aa7f9;
      --cyan-dark: #0d85d9;
      --gold: #f0c75d;
      --gold-dark: #d4a63b;
      --ink: #11181d;
      --muted: #57707c;
      --tile: #eaf4fa;
      --line: #b2d4e7;
      --card: #f2f7fb;
      --white: #ffffff;
      --shadow: 0 12px 20px rgba(17, 24, 29, 0.10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--sky);
      color: var(--ink);
    }

    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
    a { text-decoration: none; }

    .page {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.6));
      border-bottom: 1px solid rgba(177, 210, 227, 0.9);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-right: auto;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: contain;
      background: rgba(255,255,255,0.2);
    }

    .brand-text {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      line-height: 0.9;
      font-size: 1.55rem;
      letter-spacing: -0.04em;
      color: #1d4e70;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-weight: 600;
      color: #4d6774;
    }

    .nav-links a {
      color: #4d6774;
    }

    .nav-search {
      width: min(350px, 30vw);
      height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.75);
      border: 1px solid #d5e7f4;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: #5a7a8a;
    }

    .nav-search input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.98rem;
      color: var(--ink);
    }

    .hero-header {
      background: linear-gradient(90deg, #1ca4f7, #0c8de5);
      border-radius: 18px;
      box-shadow: 0 8px 0 rgba(23, 94, 148, 0.5);
      padding: 18px 24px;
      color: white;
      font-family: 'Baloo 2', cursive;
      font-size: clamp(2rem, 2.8vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 22px 0 20px;
    }

    .series-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(170px, 1fr));
      gap: 18px 18px;
      padding-bottom: 24px;
    }

    .set-card {
      display: block;
      background: rgba(255,255,255,0.55);
      border: 2px solid #d4c26a;
      border-radius: 16px;
      overflow: hidden;
      min-height: 254px;
      box-shadow: 0 5px 0 rgba(128, 117, 34, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      text-align: left;
      padding: 0;
    }

    .set-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(128,117,34,0.24);
    }

    .set-art {
      height: 156px;
      background: linear-gradient(180deg, #dff2ff 0%, #ebf8ff 100%);
      border-bottom: 2px solid #d3c163;
      display: grid;
      place-items: center;
      padding: 10px 12px;
    }

    .set-word {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      line-height: 0.88;
      color: #0e486b;
      letter-spacing: -0.06em;
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(1.2rem, 1.8vw, 2.2rem);
      text-shadow: 2px 2px 0 rgba(255,255,255,0.62);
      transform: skewX(-4deg);
    }

    .set-name-box {
      background: rgba(255,255,255,0.9);
      padding: 14px 12px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #152a35;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .view {
      display: none;
      padding-bottom: 50px;
    }

    .view.open {
      display: block;
    }

    .collection-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 20px 0 18px;
    }

    .back-btn {
      background: rgba(255,255,255,0.8);
      border: 1px solid #d6e6f3;
      color: #1b7bc2;
      font-weight: 700;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .collection-title {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      font-size: clamp(2rem, 2.8vw, 3rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: #1b2d39;
    }

    .poke-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .poke-card {
      background: rgba(255,255,255,0.78);
      border: 1px solid #d5e5ef;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .poke-img {
      height: 160px;
      background: linear-gradient(180deg, #dfeeff, #fafaf7);
      display: grid;
      place-items: center;
      font-size: 3rem;
      color: #5e7a96;
      overflow: hidden;
    }

    .poke-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poke-body {
      padding: 12px 14px 14px;
    }

    .poke-name {
      font-weight: 800;
      font-size: 1.05rem;
      color: #11242c;
      margin-bottom: 6px;
    }

    .poke-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.74rem;
      color: #4f6570;
      border-top: 1px solid #edf3f7;
      padding-top: 8px;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      background: #edfaf3;
      color: #0f7a4b;
      border-radius: 999px;
      padding: 6px 8px;
      font-weight: 800;
      font-size: 0.72rem;
    }

    .admin-open-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      border: none;
      border-radius: 12px;
      background: #0d8de3;
      color: white;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(13,141,227,.25);
    }

    .admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .admin-panel {
      width: min(900px, 100%);
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.2);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .admin-header h2 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2rem);
      color: #111827;
    }

    .admin-close-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      cursor: pointer;
    }

    .admin-login input,
    .card-form input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #dfeaf2;
      margin-bottom: 10px;
      font: inherit;
    }

    .admin-login button,
    .card-form button,
    .card-list button {
      font: inherit;
      cursor: pointer;
    }

    .admin-login button,
    .card-form button[type="submit"] {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #0d8de3;
      color: white;
      font-weight: 800;
    }

    .admin-content {
      display: none;
    }

    .card-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .logout-btn {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .cards-list {
      max-height: 300px;
      overflow: auto;
      border-top: 1px solid #edf3f8;
      margin-top: 12px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #edf3f8;
    }

    .card-row strong {
      display: block;
      margin-bottom: 3px;
    }

    .card-row small {
      color: #536a75;
    }

    .card-row-buttons {
      display: flex;
      gap: 8px;
    }

    .edit-btn {
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: #0d8de3;
      color: white;
    }

    .delete-btn {
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      background: #ef4444;
      color: white;
    }

    @media (max-width: 1180px) {
      .series-grid { grid-template-columns: repeat(5, minmax(160px,1fr)); }
    }

    @media (max-width: 940px) {
      .series-grid { grid-template-columns: repeat(3, minmax(150px,1fr)); }
      .nav-links { display: none; }
      .nav-search { width: min(220px, 40vw); }
    }

    @media (max-width: 620px) {
      .page { width: min(100% - 20px, 1400px); }
      .nav { min-height: 66px; }
      .brand-logo { width: 46px; height: 46px; }
      .brand-text { font-size: 1.2rem; }
      .nav-search { display: none; }
      .series-grid { grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 14px; }
      .set-art { height: 124px; }
      .set-name-box { font-size: 0.9rem; min-height: 62px; }
      .collection-header { align-items: flex-start; flex-direction: column; }
      .card-form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="page nav">
      <div class="brand">
        <img class="brand-logo" src="brightbird-logo.png.JPG" alt="Bright Bird logo" />
        <div class="brand-text">BRIGHT BIRD</div>
      </div>
      <nav class="nav-links">
        <a href="#reeksen">Reeksen</a>
        <a href="#collectie">Collectie</a>
        <a href="#faq">FAQ</a>
      </nav>
      <label class="nav-search" aria-label="Zoeken">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Zoek reeks of kaart..." />
      </label>
    </div>
  </header>

  <main class="page">
    <div class="hero-header">Mega Evolution • 2025 – heden</div>

    <section id="seriesView" class="view open">
      <div id="seriesGrid" class="series-grid"></div>
    </section>

    <section id="collectionView" class="view">
      <div class="collection-header">
        <button id="backBtn" class="back-btn" type="button">← Alle reeksen</button>
        <h2 id="collectionTitle" class="collection-title">Reeks</h2>
      </div>
      <div id="collectionGrid" class="poke-grid"></div>
    </section>
  </main>

  <button id="adminOpenBtn" class="admin-open-btn">Admin</button>

  <div id="adminModal" class="admin-modal">
    <div class="admin-panel">
      <div class="admin-header">
        <h2>Admin paneel</h2>
        <button id="adminCloseBtn" class="admin-close-btn" type="button">Sluiten</button>
      </div>

      <div id="adminLoginWrap" class="admin-login">
        <input id="adminEmail" type="email" placeholder="E-mail" />
        <input id="adminPassword" type="password" placeholder="Wachtwoord" />
        <button id="loginBtn" type="button">Inloggen</button>
      </div>

      <div id="adminPanel" class="admin-content">
        <form id="cardForm" class="card-form">
          <div class="card-form-grid">
            <input name="name" placeholder="Kaartnaam" required />
            <input name="set_name" placeholder="Reeks" required />
            <input name="number" placeholder="Nummer" required />
            <input name="rarity" placeholder="Rarity" value="Rare" />
            <input name="type" placeholder="Type" value="Electric" />
            <input name="condition" placeholder="Conditie" value="Mint" />
            <input name="price" type="number" step="0.01" placeholder="Prijs" value="24.9" />
            <input name="image" placeholder="Afbeeldingslink" />
          </div>

          <div class="card-form-actions">
            <button type="submit">Opslaan</button>
            <button type="button" id="logoutBtn" class="logout-btn">Uitloggen</button>
          </div>
        </form>

        <h3 style="margin:20px 0 12px;">Bestaande kaarten</h3>
        <div id="cardsList" class="cards-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zshiboydolzozgoivyui.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzaGlib3lkb2x6b3pnb2l2eXVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MjA5NzksImV4cCI6MjEwOTM5Njk3OX0.0fSYlmLLM_E6wuQS3Vu6gI4IOji-7mY0EAapkKT-bEg";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let cards = [];
    const seriesGrid = document.getElementById('seriesGrid');
    const collectionView = document.getElementById('collectionView');
    const seriesView = document.getElementById('seriesView');
    const collectionTitle = document.getElementById('collectionTitle');
    const collectionGrid = document.getElementById('collectionGrid');
    const backBtn = document.getElementById('backBtn');
    const searchInput = document.getElementById('searchInput');
    const cardForm = document.getElementById('cardForm');
    const cardsList = document.getElementById('cardsList');

    function renderSeries(query = '') {
      const clean = query.toLowerCase().trim();
      const grouped = new Map();

      cards.forEach((card) => {
        const setName = (card.set_name || '').trim();
        if (!setName) return;

        const matches = !clean ||
          setName.toLowerCase().includes(clean) ||
          (card.name || '').toLowerCase().includes(clean) ||
          (card.number || '').toLowerCase().includes(clean);

        if (matches) {
          if (!grouped.has(setName)) grouped.set(setName, []);
          grouped.get(setName).push(card);
        }
      });

      const entries = Array.from(grouped.entries());
      seriesGrid.innerHTML = entries.map(([setName]) => `
        <button class="set-card" type="button" data-series="${encodeURIComponent(setName)}">
          <div class="set-art">
            <div class="set-word">${setName}</div>
          </div>
          <div class="set-name-box">${setName}</div>
        </button>
      `).join('');

      seriesGrid.querySelectorAll('.set-card').forEach((button) => {
        button.addEventListener('click', () => {
          const name = decodeURIComponent(button.dataset.series);
          showCollection(name);
        });
      });
    }

    function showCollection(name) {
      const items = cards.filter((card) => (card.set_name || '') === name);
      collectionTitle.textContent = name;
      collectionGrid.innerHTML = items.map((card) => `
        <article class="poke-card">
          <div class="poke-img">
            ${card.image ? `<img src="${card.image}" alt="${card.name}" />` : '✦'}
          </div>
          <div class="poke-body">
            <div class="poke-name">${card.name}</div>
            <div class="poke-meta">
              <span>${card.set_name}</span>
              <span class="badge">#${card.number}</span>
            </div>
          </div>
        </article>
      `).join('');

      seriesView.classList.remove('open');
      collectionView.classList.add('open');
    }

    async function loadCards() {
      const { data, error } = await supabase
        .from('cards')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error(error);
        return;
      }

      cards = data || [];
      renderSeries();

      if (collectionView.classList.contains('open')) {
        const current = collectionTitle.textContent.trim();
        if (current) showCollection(current);
      }
    }

    function renderAdminList() {
      cardsList.innerHTML = cards.map((card) => `
        <div class="card-row">
          <div>
            <strong>${card.name}</strong>
            <small>${card.set_name} • #${card.number}</small>
          </div>
          <div class="card-row-buttons">
            <button type="button" class="edit-btn" data-edit="${card.id}">Bewerk</button>
            <button type="button" class="delete-btn" data-delete="${card.id}">Verwijder</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('[data-edit]').forEach((button) => {
        button.addEventListener('click', () => {
          const card = cards.find((item) => item.id === Number(button.dataset.edit));
          if (!card) return;

          cardForm.name.value = card.name || '';
          cardForm.set_name.value = card.set_name || '';
          cardForm.number.value = card.number || '';
          cardForm.rarity.value = card.rarity || 'Rare';
          cardForm.type.value = card.type || 'Electric';
          cardForm.condition.value = card.condition || 'Mint';
          cardForm.price.value = card.price || 0;
          cardForm.image.value = card.image || '';
          cardForm.dataset.editId = card.id;
        });
      });

      document.querySelectorAll('[data-delete]').forEach((button) => {
        button.addEventListener('click', async () => {
          const ok = confirm('Weet je zeker dat je deze kaart wil verwijderen?');
          if (!ok) return;

          const { error } = await supabase
            .from('cards')
            .delete()
            .eq('id', Number(button.dataset.delete));

          if (error) {
            console.error(error);
            alert('Verwijderen mislukt');
            return;
          }

          await loadCards();
        });
      });
    }

    async function saveCard(event) {
      event.preventDefault();

      const payload = {
        name: cardForm.name.value.trim(),
        set_name: cardForm.set_name.value.trim(),
        number: cardForm.number.value.trim(),
        rarity: cardForm.rarity.value.trim() || 'Rare',
        type: cardForm.type.value.trim() || 'Unknown',
        condition: cardForm.condition.value.trim() || 'Mint',
        price: Number(cardForm.price.value || 0),
        image: cardForm.image.value.trim() || '',
        tag: (cardForm.rarity.value.trim() || 'rare').toLowerCase()
      };

      if (!payload.name || !payload.set_name || !payload.number) {
        alert('Vul minimaal naam, reeks en nummer in.');
        return;
      }

      const editId = cardForm.dataset.editId;
      let result;

      if (editId) {
        result = await supabase
          .from('cards')
          .update(payload)
          .eq('id', Number(editId));
      } else {
        result = await supabase
          .from('cards')
          .insert([payload]);
      }

      if (result.error) {
        console.error(result.error);
        alert('Opslaan mislukt');
        return;
      }

      cardForm.reset();
      delete cardForm.dataset.editId;
      await loadCards();
      renderAdminList();
    }

    async function loginAdmin() {
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();

      if (!email || !password) {
        alert('Vul e-mail en wachtwoord in.');
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Onjuiste inloggegevens');
        return;
      }

      document.getElementById('adminLoginWrap').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      await loadCards();
      renderAdminList();
    }

    async function logoutAdmin() {
      const { error } = await supabase.auth.signOut();
      if (!error) {
        document.getElementById('adminLoginWrap').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('adminPassword').value = '';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', loginAdmin);
    document.getElementById('logoutBtn').addEventListener('click', logoutAdmin);
    document.getElementById('cardForm').addEventListener('submit', saveCard);
    document.getElementById('adminOpenBtn').addEventListener('click', () => {
      document.getElementById('adminModal').style.display = 'flex';
    });
    document.getElementById('adminCloseBtn').addEventListener('click', () => {
      document.getElementById('adminModal').style.display = 'none';
    });

    backBtn.addEventListener('click', () => {
      collectionView.classList.remove('open');
      seriesView.classList.add('open');
    });

    searchInput.addEventListener('input', (event) => {
      renderSeries(event.target.value);
    });

    supabase.auth.onAuthStateChange((event, session) => {
      const loginWrap = document.getElementById('adminLoginWrap');
      const adminPanel = document.getElementById('adminPanel');

      if (session) {
        loginWrap.style.display = 'none';
        adminPanel.style.display = 'block';
        renderAdminList();
      } else {
        loginWrap.style.display = 'block';
        adminPanel.style.display = 'none';
      }
    });

    loadCards();
  </script>
</body>
</html>
