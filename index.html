<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bright Bird Cardshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #d9effb;
      --panel: #e8f5ff;
      --cyan: #1aa7f9;
      --cyan-dark: #0d85d9;
      --gold: #f0c75d;
      --gold-dark: #d4a63b;
      --ink: #11181d;
      --muted: #57707c;
      --tile: #eaf4fa;
      --line: #b2d4e7;
      --card: #f2f7fb;
      --white: #ffffff;
      --shadow: 0 12px 20px rgba(17, 24, 29, 0.10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--sky);
      color: var(--ink);
    }

    img { max-width: 100%; display: block; }
    button, input { font: inherit; }
    a { text-decoration: none; }

    .page {
      width: min(1400px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.6));
      border-bottom: 1px solid rgba(177, 210, 227, 0.9);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-right: auto;
    }

    .brand-logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      object-fit: contain;
      background: rgba(255,255,255,0.2);
    }

    .brand-text {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      line-height: 0.9;
      font-size: 1.55rem;
      letter-spacing: -0.04em;
      color: #1d4e70;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-weight: 600;
      color: #4d6774;
    }

    .nav-links a {
      color: #4d6774;
    }

    .nav-search {
      width: min(350px, 30vw);
      height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.75);
      border: 1px solid #d5e7f4;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      color: #5a7a8a;
    }

    .nav-search input {
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.98rem;
      color: var(--ink);
    }

    .hero-header {
      background: linear-gradient(90deg, #1ca4f7, #0c8de5);
      border-radius: 18px;
      box-shadow: 0 8px 0 rgba(23, 94, 148, 0.5);
      padding: 18px 24px;
      color: white;
      font-family: 'Baloo 2', cursive;
      font-size: clamp(2rem, 2.8vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 22px 0 20px;
    }

    .series-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(170px,1fr));
      gap: 18px 18px;
      padding-bottom: 24px;
    }

    .set-card {
      display: block;
      background: rgba(255,255,255,0.55);
      border: 2px solid #d4c26a;
      border-radius: 16px;
      overflow: hidden;
      min-height: 254px;
      box-shadow: 0 5px 0 rgba(128, 117, 34, 0.18);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
    }

    .set-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(128,117,34,0.24);
    }

    .set-art {
      height: 156px;
      background: linear-gradient(180deg, #dff2ff 0%, #ebf8ff 100%);
      border-bottom: 2px solid #d3c163;
      display: grid;
      place-items: center;
      padding: 10px 12px;
    }

    .set-word {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      line-height: 0.88;
      color: #0e486b;
      letter-spacing: -0.06em;
      text-align: center;
      text-transform: uppercase;
      font-size: clamp(1.2rem, 1.8vw, 2.2rem);
      text-shadow: 2px 2px 0 rgba(255,255,255,0.62);
      transform: skewX(-4deg);
    }

    .set-word.small {
      font-size: clamp(1rem, 1.4vw, 1.7rem);
    }

    .set-name-box {
      background: rgba(255,255,255,0.9);
      border-top: 0;
      padding: 14px 12px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #152a35;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .series-grid .set-card:nth-child(1) .set-word,
    .series-grid .set-card:nth-child(6) .set-word,
    .series-grid .set-card:nth-child(10) .set-word {
      color: #0d3d66;
    }

    .view {
      display: none;
      padding-bottom: 50px;
    }

    .view.open {
      display: block;
    }

    .collection-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 20px 0 18px;
    }

    .back-btn {
      background: rgba(255,255,255,0.8);
      border: 1px solid #d6e6f3;
      color: #1b7bc2;
      font-weight: 700;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .collection-title {
      margin: 0;
      font-family: 'Baloo 2', cursive;
      font-size: clamp(2rem, 2.8vw, 3rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: #1b2d39;
    }

    .poke-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .poke-card {
      background: rgba(255,255,255,0.78);
      border: 1px solid #d5e5ef;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .poke-img {
      height: 160px;
      background: linear-gradient(180deg, #dfeeff, #fafaf7);
      display: grid;
      place-items: center;
      font-size: 3rem;
      color: #5e7a96;
    }

    .poke-body {
      padding: 12px 14px 14px;
    }

    .poke-name {
      font-weight: 800;
      font-size: 1.05rem;
      color: #11242c;
      margin-bottom: 6px;
    }

    .poke-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.74rem;
      color: #4f6570;
      border-top: 1px solid #edf3f7;
      padding-top: 8px;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      background: #edfaf3;
      color: #0f7a4b;
      border-radius: 999px;
      padding: 6px 8px;
      font-weight: 800;
      font-size: 0.72rem;
    }

    @media (max-width: 1180px) {
      .series-grid { grid-template-columns: repeat(5, minmax(160px,1fr)); }
    }

    @media (max-width: 940px) {
      .series-grid { grid-template-columns: repeat(3, minmax(150px,1fr)); }
      .nav-links { display: none; }
      .nav-search { width: min(220px, 40vw); }
    }

    @media (max-width: 620px) {
      .page { width: min(100% - 20px, 1400px); }
      .nav { min-height: 66px; }
      .brand-logo { width: 46px; height: 46px; }
      .brand-text { font-size: 1.2rem; }
      .nav-search { display: none; }
      .series-grid { grid-template-columns: repeat(2, minmax(130px, 1fr)); gap: 14px; }
      .set-art { height: 124px; }
      .set-name-box { font-size: 0.9rem; min-height: 62px; }
      .collection-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="page nav">
      <div class="brand">
        <img class="brand-logo" src="brightbird-logo.svg" alt="Bright Bird logo" />
        <div class="brand-text">BRIGHT BIRD</div>
      </div>
      <nav class="nav-links">
        <a href="#reeksen">Reeksen</a>
        <a href="#collectie">Collectie</a>
        <a href="#faq">FAQ</a>
      </nav>
      <label class="nav-search" aria-label="Zoeken">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Zoek reeks of kaart..." />
      </label>
    </div>
  </header>

  <main class="page">
    <div class="hero-header">Mega Evolution • 2025 – heden</div>

    <section id="seriesView" class="view open">
      <div id="seriesGrid" class="series-grid"></div>
    </section>

    <section id="collectionView" class="view">
      <div class="collection-header">
        <button id="backBtn" class="back-btn" type="button">← Alle reeksen</button>
        <h2 id="collectionTitle" class="collection-title">Reeks</h2>
      </div>
      <div id="collectionGrid" class="poke-grid"></div>
    </section>
  </main>

  <script>
    const collection = [
      { name: "Team Rocket's Mewtwo ex", set: "Destined Rivals", code: "DRI EN", number: "231"},
      { name: "Umbreon ex", set: "Prismatic Evolutions", code: "PRE EN", number: "161"},
      { name: "Mewtwo & Mew GX", set: "Unified Minds", code: "Unified Minds", number: "71"},
      { name: "Reshiram ex", set: "White Flare JP", code: "sv11W", number: "174"},
      { name: "Slowpoke & Psyduck GX", set: "Unified Minds", code: "Unified Minds", number: "218"},
      { name: "Moltres & Zapdos & Articuno", set: "Hidden Fates", code: "Hidden Fates", number: "69"},
      { name: "Victini VMAX", set: "Battle Styles", code: "Battle Styles", number: "165"},
      { name: "Gengar", set: "Lost Origin", code: "Lost Origin", number: "TG06"},
      { name: "Eevee", set: "Brilliant Stars", code: "Brilliant Stars", number: "TG11"},
      { name: "Chimchar", set: "DP Black Star Promos", code: "DP Black Star Promos", number: "2"},
      { name: "Pikachu", set: "Cosmic Eclipse", code: "Cosmic Eclipse", number: "241"},
      { name: "Zeraora V", set: "Chilling Reign", code: "Chilling Reign", number: "166"},
      { name: "Lugia V", set: "Silver Tempest", code: "Silver Tempest", number: "138"},
      { name: "Garbodor", set: "Paradox Rift", code: "PAR EN", number: "204"},
      { name: "Dragapult ex", set: "Prismatic Evolutions", code: "PRE EN", number: "165"},
      { name: "Milotic ex", set: "Surging Sparks", code: "SSP EN", number: "237"},
      { name: "Mega Dragonite ex", set: "Ascended Heroes", code: "ASC EN", number: "295"},
      { name: "Mega Charizard Y ex", set: "Ascended Heroes", code: "ASC EN", number: "294"},
      { name: "M Charizard ex", set: "Evolutions", code: "Evolutions", number: "101"},
      { name: "Pikachu", set: "Lost Origin", code: "Lost Origin", number: "TG05"},
      { name: "Mega Greninja ex", set: "Chaos Rising", code: "CRI EN", number: "116" }
    ];

    const seriesGrid = document.getElementById('seriesGrid');
    const collectionView = document.getElementById('collectionView');
    const seriesView = document.getElementById('seriesView');
    const collectionTitle = document.getElementById('collectionTitle');
    const collectionGrid = document.getElementById('collectionGrid');
    const searchInput = document.getElementById('searchInput');
    const backBtn = document.getElementById('backBtn');

    function formatSetName(name) {
      return name === 'DP Black Star Promos' ? 'DP Black Star Promos' : name;
    }

    function getSeriesData() {
      return Array.from(new Map(
        collection.map(card => [card.set, card])
      ).keys()).map(setName => ({
        name: setName,
        cards: collection.filter(card => card.set === setName)
      }));
    }

    function getWordmarkLabel(name) {
      if (name === '30th Celebration') return '30th Celebration';
      if (name === 'DP Black Star Promos') return 'Mega Evolution Promos';
      if (name === 'Lost Origin') return 'Lost Origin';
      if (name === 'Chaos Rising') return 'Chaos Rising';
      if (name === 'Ascended Heroes') return 'Ascended Heroes';
      if (name === 'Prismatic Evolutions') return 'Prismatic Evolutions';
      return name;
    }

    function renderSeries(query='') {
      const clean = query.toLowerCase().trim();
      const items = getSeriesData().filter(series => {
        if (!clean) return true;
        return series.name.toLowerCase().includes(clean)
          || series.cards.some(card => card.name.toLowerCase().includes(clean));
      });

      seriesGrid.innerHTML = items.map(series => {
        const label = getWordmarkLabel(series.name);
        return `
          <button class="set-card" type="button" data-series="${encodeURIComponent(series.name)}">
            <div class="set-art">
              <div class="set-word ${series.name === 'DP Black Star Promos' ? 'small' : ''}">${label}</div>
            </div>
            <div class="set-name-box">${series.name}</div>
          </button>
        `;
      }).join('');

      seriesGrid.querySelectorAll('.set-card').forEach(btn => {
        btn.addEventListener('click', () => {
          const name = decodeURIComponent(btn.dataset.series);
          showCollection(name);
        });
      });
    }

    function showCollection(name) {
      const seriesCards = collection.filter(card => card.set === name);
      collectionTitle.textContent = name;
      collectionGrid.innerHTML = seriesCards.map(card => `
        <article class="poke-card">
          <div class="poke-img">✦</div>
          <div class="poke-body">
            <div class="poke-name">${card.name}</div>
            <div class="poke-meta">
              <span>${card.set}</span>
              <span class="badge">#${card.number}</span>
            </div>
          </div>
        </article>
      `).join('');

      seriesView.classList.remove('open');
      collectionView.classList.add('open');
    }

    backBtn.addEventListener('click', () => {
      collectionView.classList.remove('open');
      seriesView.classList.add('open');
    });

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      if (collectionView.classList.contains('open')) {
        const visible = document.getElementById('collectionTitle').textContent;
        const list = collection.filter(card => card.set === visible && (
          !q || card.name.toLowerCase().includes(q.toLowerCase()) || card.number.includes(q)
        ));

        collectionGrid.innerHTML = list.map(card => `
          <article class="poke-card">
            <div class="poke-img">✦</div>
            <div class="poke-body">
              <div class="poke-name">${card.name}</div>
              <div class="poke-meta">
                <span>${card.set}</span>
                <span class="badge">#${card.number}</span>
              </div>
            </div>
          </article>
        `).join('');
        return;
      }

      renderSeries(q);
    });

    renderSeries();
  </script>
</body>
</html>
